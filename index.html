<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  body {
    /* あの綺麗な水色の背景 */
    background-color: #70d6ff;
    color: #ffffff;
    font-family: 'DotGothic16', monospace;
    margin: 0;
    padding: 0;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 16px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* タイトル */
  h1 {
    font-size: 1.6rem;
    letter-spacing: 0.1em;
    margin: 0 0 32px;
    text-shadow: 2px 2px 0px #2b3a4a;
    text-align: center;
  }

  /* クリックボタンの並び（枠なし、画像そのまま置ける仕様） */
  .button-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 320px;
    margin-bottom: 48px;
  }

  .pixel-btn-link {
    display: block;
    text-decoration: none;
    transition: transform 0.1s ease;
  }

  .pixel-btn-link:hover {
    transform: scale(1.03);
  }

  /* ボタン用のドット絵画像（自分で描いたものをここに反映） */
  .pixel-btn-link img {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
  }

  /* テキストで代用する場合の仮ボタン（画像を作るまでの仮置き） */
  .temp-btn {
    background: #ff8fab;
    color: #ffffff;
    border: 3px solid #ffffff;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    font-weight: bold;
    box-shadow: 0 4px 0px #2b3a4a;
  }

  /* 一番下に置くドット絵の男の子（枠なしでスッキリ配置） */
  .art-area {
    width: 100%;
    max-width: 280px;
    text-align: center;
    margin-top: 16px;
  }

  .art-area img {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
  }

  footer {
    margin-top: 48px;
    font-size: 0.75rem;
    color: #ffffff;
    opacity: 0.8;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  
  <h1>ARCHIVE</h1>

  <!-- ▼ スライド・レポートを開くボタン群（画像に差し替え可能） -->
  <div class="button-list">
    
    <!-- 01: スライド -->
    <a href="report-2026-01.pdf" target="_blank" class="pixel-btn-link">
      <!-- 自分でボタン画像（例: btn-slide01.png）を作ったら差し替えてね -->
      <img src="btn-slide01.png" alt="Slide 01" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="temp-btn" style="display:none;">▶ スライド 01</div>
    </a>

    <!-- 02: スライド -->
    <a href="report-2026-02.pdf" target="_blank" class="pixel-btn-link">
      <img src="btn-slide02.png" alt="Slide 02" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="temp-btn" style="display:none;">▶ スライド 02</div>
    </a>

    <!-- 03: スライド -->
    <a href="report-2026-03.pdf" target="_blank" class="pixel-btn-link">
      <img src="btn-slide03.png" alt="Slide 03" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="temp-btn" style="display:none;">▶ スライド 03</div>
    </a>

    <!-- 04: レポート -->
    <a href="report-2026-04.pdf" target="_blank" class="pixel-btn-link">
      <img src="btn-report04.png" alt="Report 04" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="temp-btn" style="display:none; background:#70d6ff; border-color:#fff;">▶ レポート 04</div>
    </a>

  </div>

  <!-- ▼ 一番下に配置するドット絵の男の子（枠なし） -->
  <div class="art-area">
    <!-- 自分で描いた男の子の画像（例: boy.png）をアップロードしてね -->
    <img src="boy.png" alt="Pixel Art Boy" onerror="this.style.display='none';">
  </div>

  <footer>
    &copy; 2026 YOUR NAME
  </footer>

</div>
</body>
</html>
