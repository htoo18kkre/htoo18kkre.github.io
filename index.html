<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  body {
    /* 画像と同じ鮮やかな水色の背景 */
    background-color: #48b2e5;
    color: #ffffff;
    font-family: 'DotGothic16', monospace;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: none;
  }

  .wrap {
    max-width: 420px;
    margin: 0 auto;
    padding: 56px 32px 64px;
  }

  /* タイトル周り（画像と同じ左寄せ・枠なし・白ドット文字） */
  header {
    margin-bottom: 48px;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.08em;
    margin: 0;
    font-weight: normal;
  }

  /* ボタンのリスト（横長にせず、左側にコンパクトに並べる） */
  .link-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 22px;
    margin-bottom: 64px;
  }

  /* 1つ1つのリンク（バッジ＋右横の文字） */
  .pixel-item {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: #ffffff;
    transition: transform 0.1s steps(2, start);
  }

  .pixel-item:hover {
    transform: translateX(4px);
  }

  /* ドット絵風のオリジナルバッジ（画像のボタン形状を再現） */
  .pixel-badge {
    display: inline-flex;
    align-items: stretch;
    height: 46px;
    position: relative;
    /* 四隅を1ドット分削ってピクセルアートの角丸感を出す */
    clip-path: polygon(
      0 4px, 4px 4px, 4px 0,
      calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px,
      100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%,
      4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)
    );
  }

  /* バッジのメイン部分（文字が入るところ） */
  .badge-main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    font-size: 1.25rem;
    letter-spacing: 0.06em;
    color: #ffffff;
    line-height: 1;
  }

  /* バッジの右端のタブ部分（上下に白いドットが2つあるデザイン） */
  .badge-tab {
    width: 18px;
    position: relative;
  }

  /* 上下の白い2つのドット */
  .badge-tab::before,
  .badge-tab::after {
    content: "";
    position: absolute;
    right: 5px;
    width: 4px;
    height: 4px;
    background-color: #ffffff;
  }
  .badge-tab::before { top: 6px; }
  .badge-tab::after { bottom: 6px; }

  /* ✦ スライド用の色（カービィ風の可愛いピンク） */
  .type-slide .badge-main { background-color: #ff6b9d; }
  .type-slide .badge-tab { background-color: #ff9ebb; }

  /* ✦ レポート用の色（アクセントになるレトロパープル） */
  .type-report .badge-main { background-color: #7b68ee; }
  .type-report .badge-tab { background-color: #a496f7; }
