<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  body {
    /* 爽やかで優しい水色 */
    background-color: #5bc0eb;
    color: #ffffff;
    font-family: 'DotGothic16', monospace;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: none;
  }

  .wrap {
    max-width: 420px;
    margin: 0 auto;
    padding: 56px 32px 64px;
  }

  /* タイトル */
  header {
    margin-bottom: 44px;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.1em;
    margin: 0;
    font-weight: normal;
    text-shadow: 3px 3px 0px #2b4c6f;
  }

  /* ボタンのリスト（コンパクトな左寄せ） */
  .link-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 60px;
  }

  .pixel-item {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: #ffffff;
    transition: transform 0.1s ease;
  }

  /* 押したときにボタンがポチッと沈む動き */
  .pixel-item:hover .pixel-btn {
    transform: translateY(3px);
    box-shadow: 0 2px 0px #2b4c6f;
  }

  /* ✦ オリジナル：ぷっくり立体ドットボタン（ツヤ＆影つき） */
  .pixel-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    padding: 0 16px;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    color: #ffffff;
    border: 3px solid #ffffff;
    border-radius: 8px;
    box-shadow: 0 5px 0px #2b4c6f; /* 立体感を出す濃い青の影 */
    position: relative;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  /* ボタン左上の「キラッ」としたドットのツヤ（ハイライト） */
  .pixel-btn::before {
    content: "";
    position: absolute;
    top: 4px;
    left: 6px;
    width: 10px;
    height: 3px;
    background: rgba(255, 255, 255, 0.7);
  }

  /* スライド用（カービィ風のピンク） */
  .type-slide {
    background-color: #ff75a0;
  }

  /* レポート用（ポップなイエローオレンジ系 or パープル系） */
  .type-report {
    background-color: #8a79ff;
  }

  /* 右横のタイトル文字 */
  .item-label {
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    text-shadow: 2px 2px 0px #2b4c6f;
    white-space: nowrap;
  }

  /* 一番下のイラストエリア（枠なし） */
  .art-area {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  .art-area img {
    max-width: 260px;
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<div class="wrap">
  
  <header>
    <h1>ARCHIVE</h1>
  </header>

  <main>
    <div class="link-list">
      
      <!-- ▼ 01: スライド -->
      <a href="report-2026-01.pdf" target="_blank" class="pixel-item">
        <div class="pixel-btn type-slide">SLIDE 01</div>
        <span class="item-label">スライド 01</span>
      </a>

      <!-- ▼ 02: スライド -->
      <a href="report-2026-02.pdf" target="_blank" class="pixel-item">
        <div class="pixel-btn type-slide">SLIDE 02</div>
        <span class="item-label">スライド 02</span>
      </a>

      <!-- ▼ 03: スライド -->
      <a href="report-2026-03.pdf" target="_blank" class="pixel-item">
        <div class="pixel-btn type-slide">SLIDE 03</div>
        <span class="item-label">スライド 03</span>
      </a>

      <!-- ▼ 04: レポート -->
      <a href="report-2026-04.pdf" target="_blank" class="pixel-item">
        <div class="pixel-btn type-report">REPORT</div>
        <span class="item-label">レポート 04</span>
      </a>

    </div>

    <!-- ▼ 一番下のドット絵（枠なし） -->
    <div class="art-area">
      <img src="boy.png" alt="Pixel Art" onerror="this.style.display='none';">
    </div>
  </main>

</div>
</body>
</html>
