<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY ARCHIVE</title>
<style>
  body { background:#fafafa; color:#222; font-family:sans-serif; line-height:1.7; margin:0; }
  .wrap { max-width:720px; margin:0 auto; padding:56px 20px 80px; }
  header { text-align:center; margin-bottom:48px; }
  h1 { font-size:1.6rem; letter-spacing:0.1em; margin:0 0 8px; }
  .sub { font-size:0.88rem; color:#666; margin:0 0 20px; }
  .links { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:32px; }
  .links a { padding:5px 15px; font-size:0.8rem; color:#222; text-decoration:none; border:1px solid #e0e0e0; border-radius:99px; background:#fff; }
  .hero { width:100%; max-width:520px; margin:0 auto; aspect-ratio:16/9; background:#efefef; border:1px solid #e0e0e0; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#777; font-size:0.85rem; }
  h2 { font-size:1rem; letter-spacing:0.08em; text-align:center; border-bottom:1px solid #e0e0e0; padding-bottom:10px; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .card { display:block; background:#fff; border:1px solid #e0e0e0; border-radius:8px; padding:18px; text-decoration:none; color:inherit; }
  .tag { font-size:0.7rem; font-weight:bold; background:#f0f0f0; padding:2px 8px; border-radius:4px; margin-right:6px; }
  .date { font-size:0.75rem; color:#777; }
  .card h3 { font-size:1rem; margin:10px 0 6px; }
  .card p { font-size:0.84rem; color:#666; margin:0 0 12px; }
  .more { font-size:0.8rem; font-weight:bold; text-align:right; }
  footer { margin-top:64px; text-align:center; font-size:0.75rem; color:#888; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>HARUTO ARCHIVE</h1>
    <p class="sub">個人制作の資料・スライド・まとめノート置き場</p>
    <nav class="links">
      <a href="https://x.com/" target="_blank">X</a>
      <a href="https://instagram.com/" target="_blank">Instagram</a>
      <a href="https://note.com/" target="_blank">note</a>
    </nav>
    <div class="hero">Main Visual / Photo Area</div>
  </header>

  <main>
    <h2>MATERIALS / ARCHIVE</h2>
    <div class="grid">
      <a href="sample.pdf" target="_blank" class="card">
        <div><span class="tag">PDF</span><span class="date">2026.10</span></div>
        <h3>サンプル資料タイトル 01</h3>
        <p>ここに資料の簡単な説明を書きます。タップするとPDFが別タブで開きます。</p>
        <div class="more">資料を開く →</div>
      </a>
      <a href="slide.pdf" target="_blank" class="card">
        <div><span class="tag">SLIDE</span><span class="date">2026.10</span></div>
        <h3>発表スライド・まとめ資料</h3>
        <p>作成したスライドのPDFや共有リンクをここに設定できます。</p>
        <div class="more">資料を開く →</div>
      </a>
    </div>
  </main>

  <footer>&copy; 2026 YOUR NAME</footer>
</div>
</body>
</html>
