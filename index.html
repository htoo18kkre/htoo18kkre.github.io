<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDY ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-sky: #b8e2f2;       /* 綺麗な水色基調 */
    --card-bg: #ffffff;      
    --border-main: #2b4c6f;  /* エモい深めの青みアウトライン */
    --accent-pink: #ff8fab;  /* 桜や差し色のピンク */
    --text-main: #243447;    
  }

  body {
    background-color: var(--bg-sky);
    /* 背景に桜のドット（十字の形）を散りばめるパターン */
    background-image: 
      radial-gradient(var(--accent-pink) 20%, transparent 21%),
      radial-gradient(var(--accent-pink) 20%, transparent 21%);
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
    color: var(--text-main);
    font-family: 'DotGothic16', monospace;
    line-height: 1.8;
    margin: 0;
    padding: 0;
  }

  .wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 16px 60px;
  }

  /* シンプルなタイトル */
  header {
    text-align: center;
    margin-bottom: 32px;
    background: #ffffff;
    border: 4px solid var(--border-main);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 5px 0px var(--border-main);
  }

  h1 {
    font-size: 1.5rem;
    letter-spacing: 0.1em;
    margin: 0;
    color: var(--accent-pink);
    text-shadow: 2px 2px 0px var(--border-main);
  }

  /* レポートリスト（タップで一発PDFオープン） */
  .grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 36px;
  }

  .card {
    display: block;
    background: var(--card-bg);
    border: 4px solid var(--border-main);
    border-radius: 12px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--text-main);
    font-size: 1.05rem;
    font-weight: bold;
    box-shadow: 0 5px 0px var(--border-main);
    transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s;
  }

  .card:hover {
    transform: translateY(2px);
    box-shadow: 0 3px 0px var(--border-main);
    background: #fff5f8;
    color: var(--accent-pink);
  }

  /* 下部のドット絵（メガネ・本・電卓を持った勉強する男の子） */
  .art-box {
    background: #ffffff;
    border: 4px solid var(--border-main);
    border-radius: 16px;
    padding: 24px 16px;
    text-align: center;
    box-shadow: 0 6px 0px var(--border-main);
  }

  .pixel-canvas {
    width: 140px;
    height: 110px;
    margin: 0 auto;
    background: #e1f3fb;
    border: 3px solid var(--border-main);
    border-radius: 8px;
    position: relative;
  }

  /* 勉強机 */
  .desk {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 100px;
    height: 10px;
    background: #6b4423;
    border: 2px solid var(--border-main);
  }

  /* 開いた本 / 電卓 */
  .book-item {
    position: absolute;
    bottom: 30px;
    left: 55px;
    width: 28px;
    height: 10px;
    background: #fff;
    border: 2px solid var(--border-main);
  }

  /* 男の子の体（水色パーカー） */
  .boy-body {
    position: absolute;
    bottom: 20px;
    left: 53px;
    width: 30px;
    height: 22px;
    background: #4ab3f4;
    border: 2px solid var(--border-main);
    border-radius: 8px 8px 0 0;
  }

  /* 男の子の顔 */
  .boy-head {
    position: absolute;
    bottom: 40px;
    left: 56px;
    width: 24px;
    height: 22px;
    background: #ffdbac;
    border: 2px solid var(--border-main);
    border-radius: 50% 50% 40% 40%;
  }

  /* メガネ */
  .glasses {
    position: absolute;
    bottom: 48px;
    left: 60px;
    width: 14px;
    height: 6px;
    border: 2px solid var(--border-main);
    background: transparent;
  }

  /* 髪型 */
  .boy-hair {
    position: absolute;
    bottom: 58px;
    left: 55px;
    width: 26px;
    height: 10px;
    background: #5c4033;
    border: 2px solid var(--border-main);
    border-radius: 50% 50% 0 0;
  }

  footer {
    margin-top: 32px;
    text-align: center;
    font-size: 0.75rem;
    color: #4a6fa5;
  }
</style>
</head>
<body>
<div class="wrap">
  
  <header>
    <h1>★ MY ARCHIVE ★</h1>
  </header>

  <main>
    <div class="grid">
      <a href="report-2026-01.pdf" target="_blank" class="card">レポート 01</a>
      <a href="report-2026-02.pdf" target="_blank" class="card">レポート 02</a>
      <a href="report-2026-03.pdf" target="_blank" class="card">レポート 03</a>
      <a href="report-2026-04.pdf" target="_blank" class="card">レポート 04</a>
    </div>

    <!-- ▼ 一番下のピクセルアート（勉強するメガネの男の子 ＆ 桜の背景） -->
    <div class="art-box">
      <div class="pixel-canvas">
        <div class="desk"></div>
        <div class="book-item"></div>
        <div class="boy-body"></div>
        <div class="boy-head"></div>
        <div class="glasses"></div>
        <div class="boy-hair"></div>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 YOUR NAME
  </footer>

</div>
</body>
</html>
