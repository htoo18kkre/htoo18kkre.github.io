<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  body {
    /* 濃すぎず薄すぎない、ドット絵が映える絶妙な紺色の単色塗りつぶし */
    background-color: #2f4f8f;
    color: #ffffff;
    font-family: 'DotGothic16', monospace;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: none;
  }

  .wrap {
    max-width: 420px;
    margin: 0 auto;
    padding: 56px 32px 64px;
  }

  /* タイトル（画像と同じフラットな白ドット文字） */
  header {
    margin-bottom: 48px;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.08em;
    margin: 0;
    font-weight: normal;
  }

  /* ボタンのリスト */
  .link-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 22px;
    margin-bottom: 64px;
  }

  .pixel-item {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: #ffffff;
    transition: transform 0.1s steps(2, start);
  }

  .pixel-item:hover {
    transform: translateX(4px);
  }

  /* 画像と同じドット絵ボタン形状（四隅をドット階段状にカット） */
  .pixel-badge {
    display: inline-flex;
    align-items: stretch;
    height: 46px;
    position: relative;
    clip-path: polygon(
      0 6px, 3px 6px, 3px 3px, 6px 3px, 6px 0,
      calc(100% - 6px) 0, calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px,
      100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%,
      6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0 calc(100% - 6px)
    );
  }

  /* ボタンのメイン部分 */
  .badge-main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    font-size: 1.3rem;
    letter-spacing: 0.06em;
    color: #ffffff;
    line-height: 1;
  }

  /* ボタン右端の色違いタブ */
  .badge-tab {
    width: 18px;
    position: relative;
  }

  /* 右端タブの上下2つの白いドット */
  .badge-tab::before,
  .badge-tab::after {
    content: "";
    position: absolute;
    right: 5px;
    width: 4px;
    height: 4px;
    background-color: #ffffff;
  }
  .badge-tab::before { top: 7px; }
  .badge-tab::after { bottom: 7px; }

  /* ✦ スライド用ボタンの色（紺色に映えるコーラルピンク） */
  .type-slide .badge-main { background-color: #f24b59; }
  .type-slide .badge-tab { background-color: #ff8e80; }

  /* ✦ レポート用ボタンの色（紺色に映えるライムグリーン） */
  .type-report .badge-main { background-color: #38b814; }
  .type-report .badge-tab { background-color: #72e647; }

  /* ボタン右横のタイトル文字 */
  .item-label {
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  /* 一番下のドット絵エリア（枠なし） */
  .art-area {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-top: 24px;
  }

  .art-area img {
    max-width: 280px;
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<div class="wrap">
  
  <header>
    <h1>ARCHIVE</h1>
  </header>

  <main>
    <div class="link-list">
      
      <!-- ▼ 01: スライド -->
      <a href="report-2026-01.pdf" target="_blank" class="pixel-item">
        <div class="pixel-badge type-slide">
          <div class="badge-main">SLIDE 01</div>
          <div class="badge-tab"></div>
        </div>
        <span class="item-label">企業研究 01</span>
      </a>

      <!-- ▼ 02: スライド -->
      <a href="report-2026-02.pdf" target="_blank" class="pixel-item">
        <div class="pixel-badge type-slide">
          <div class="badge-main">SLIDE 02</div>
          <div class="badge-tab"></div>
        </div>
        <span class="item-label">企業研究 02</span>
      </a>

      <!-- ▼ 03: スライド -->
      <a href="report-2026-03.pdf" target="_blank" class="pixel-item">
        <div class="pixel-badge type-slide">
          <div class="badge-main">SLIDE 03</div>
          <div class="badge-tab"></div>
        </div>
        <span class="item-label">経営分析 01</span>
      </a>

      <!-- ▼ 04: レポート -->
      <a href="report-2026-04.pdf" target="_blank" class="pixel-item">
        <div class="pixel-badge type-report">
          <div class="badge-main">REPORT</div>
          <div class="badge-tab"></div>
        </div>
        <span class="item-label">経営分析 02</span>
      </a>

    </div>

    <!-- ▼ 一番下のドラゴンや魔法使いのドット絵（枠なし） -->
    <div class="art-area">
      <img src="art.png" alt="Pixel Art" onerror="this.style.display='none';">
    </div>
  </main>

</div>
</body>
</html>
