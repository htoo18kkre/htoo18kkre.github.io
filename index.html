<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  body {
    /* 夜の星空グラデーション＋小さなドット絵の星屑 */
    background-color: #0d1126;
    background-image: 
      radial-gradient(#ffffff 1px, transparent 1px),
      radial-gradient(#ffe680 1px, transparent 1px),
      radial-gradient(#8be9fd 1px, transparent 1px),
      linear-gradient(180deg, #090c1a 0%, #162142 60%, #1e2d59 100%);
    background-size: 90px 90px, 140px 140px, 190px 190px, 100% 100%;
    background-position: 0 0, 30px 50px, 70px 20px, 0 0;
    background-attachment: fixed;
    color: #ffffff;
    font-family: 'DotGothic16', monospace;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    -webkit-font-smoothing: none;
  }

  .wrap {
    max-width: 420px;
    margin: 0 auto;
    padding: 56px 32px 64px;
  }

  /* タイトル（夜空に浮かぶゴールドのドット文字） */
  header {
    margin-bottom: 44px;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.12em;
    margin: 0;
    font-weight: normal;
    color: #ffe680;
    text-shadow: 3px 3px 0px #000000;
  }

  /* ボタンリスト（左寄せ・コンパクト） */
  .link-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 22px;
    margin-bottom: 64px;
  }

  .pixel-item {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: #ffffff;
    transition: transform 0.1s steps(2, start);
  }

  .pixel-item:hover {
    transform: translateX(4px);
  }

  /* ✦ オリジナル：RPG風のドット絵バッジ */
  .pixel-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    padding: 0 14px;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    color: #ffffff;
    position: relative;
    border: 2px solid #ffffff;
    box-shadow: 
      inset 0 3px 0 rgba(255, 255, 255, 0.35),
      inset 0 -3px 0 rgba(0, 0, 0, 0.35),
      4px 4px 0px #000000;
  }

  /* ボタンの左端に小さな星のドット飾り */
  .pixel-btn::before {
    content: "✦";
    font-size: 0.85rem;
    margin-right: 8px;
    color: #ffe680;
  }

  /* スライド用（夜空に映えるマジックルビー） */
  .type-slide {
    background-color: #d9386a;
  }

  /* レポート用（魔導書風のロイヤルブルー） */
  .type-report {
    background-color: #3b5dc9;
  }

  /* ボタン右横のタイトル文字 */
  .item-label {
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    text-shadow: 2px 2px 0px #000000;
    white-space: nowrap;
  }

  .pixel-item:hover .item-label {
    color: #ffe680;
  }

  /* 一番下のドラゴン・魔法使いのドット絵エリア（枠なし） */
  .art-area {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-top: 24px;
  }

  .art-area img {
    max-width: 280px;
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<div class="wrap">
  
  <header>
    <h1>ARCHIVE</h1>
  </header>

  <main>
    <div class="link-list">
      
      <!-- ▼ 01: スライド -->
      <a href="report-2026-01.pdf" target="_blank" class="pixel-item">
        <div class="pixel-btn type-slide">SLIDE 01</div>
        <span class="item-label">スライド 01</span>
      </a>

      <!-- ▼ 02: スライド -->
      <a href="report-2026-02.pdf" target="_blank" class="pixel-item">
        <div class="pixel-btn type-slide">SLIDE 02</div>
        <span class="item-label">スライド 02</span>
      </a>

      <!-- ▼ 03: スライド -->
      <a href="report-2026-03.pdf" target="_blank" class="pixel-item">
        <div class="pixel-btn type-slide">SLIDE 03</div>
        <span class="item-label">スライド 03</span>
      </a>

      <!-- ▼ 04: レポート -->
      <a href="report-2026-04.pdf" target="_blank" class="pixel-item">
        <div class="pixel-btn type-report">REPORT</div>
        <span class="item-label">レポート 04</span>
      </a>

    </div>

    <!-- ▼ 一番下のドット絵（ドラゴンや魔法使いの画像をアップロードしたら表示） -->
    <div class="art-area">
      <!-- 画像をアップロードしたら「art.png」をそのファイル名に変えてね -->
      <img src="art.png" alt="Pixel Art" onerror="this.style.display='none';">
    </div>
  </main>

</div>
</body>
</html>
