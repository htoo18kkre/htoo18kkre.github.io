<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  body {
    /* 濃すぎず薄すぎない紺色の単色塗りつぶし */
    background-color: #263e73;
    color: #ffffff;
    font-family: 'DotGothic16', monospace;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: none;
  }

  .wrap {
    max-width: 420px;
    margin: 0 auto;
    padding: 56px 32px 64px;
  }

  /* タイトル */
  header {
    margin-bottom: 48px;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.08em;
    margin: 0;
    font-weight: normal;
  }

  /* ボタンのリスト */
  .link-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 22px;
    margin-bottom: 64px;
  }

  .pixel-item {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: #ffffff;
    transition: transform 0.1s steps(2, start);
  }

  .pixel-item:hover {
    transform: translateX(4px);
  }

  /* ドット絵ボタン形状 */
  .pixel-badge {
    display: inline-flex;
    align-items: stretch;
    height: 46px;
    position: relative;
    clip-path: polygon(
      0 6px, 3px 6px, 3px 3px, 6px 3px, 6px 0,
      calc(100% - 6px) 0, calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px,
      100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%,
      6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0 calc(100% - 6px)
    );
  }

  .badge-main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    font-size: 1.3rem;
    letter-spacing: 0.06em;
    color: #ffffff;
    line-height: 1;
  }

  .badge-tab {
    width: 18px;
    position: relative;
  }

  .badge-tab::before,
  .badge-tab::after {
    content: "";
    position: absolute;
    right: 5px;
    width: 4px;
    height: 4px;
    background-color: #ffffff;
  }
  .badge-tab::before { top: 7px; }
  .badge-tab::after { bottom: 7px; }

  /* ✦ スライド用ボタンの色 */
  .type-slide .badge-main { background-color: #f24b59; }
  .type-slide .badge-tab { background-color: #ff8e80; }

  /* ✦ レポート用ボタンの色 */
  .type-report .badge-main { background-color: #38b814; }
  .type-report .badge-tab { background-color: #72e647; }

  /* ボタン右横のタイトル文字 */
  .item-label {
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  /* ▼ 一番下のドット絵ステージ（2つ横並び＋地面） */
  .stage-area {
    width: 100%;
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 左：ドラゴン、右：男の子を横に並べて足元を揃える */
  .characters {
    display: flex;
    justify-content: center;
    align-items: flex-end; /* 足元の高さをピタッと揃える設定 */
    gap: 12px;             /* 2人の間の距離 */
    width: 100%;
    padding: 0 10px;
    box-sizing: border-box;
  }

  .characters img {
    width: 130px;          /* 1体あたりのサイズ */
    max-width: 45%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    /* ※もし絵の下に透明の余白があって地面から少し浮く場合は、下の0pxを「-8px」などに変えると地面に密着します */
    margin-bottom: 0px;
  }

  /* ドット絵風の地面（草＋土の2層ドットライン） */
  .pixel-ground {
    width: 100%;
    max-width: 320px;
    height: 12px;
    background-color: #5c4033; /* 下の土の色 */
    border-top: 6px solid #48a842; /* 上の草の色 */
    box-shadow: 
      0 -3px 0 #72d65c, /* 草のハイライト */
      0 4px 0 #18284a;  /* 地面の下の影 */
  }
</style>
</head>
<body>
<div class="wrap">
  
  <header>
    <h1>ARCHIVE</h1>
  </header>

  <main>
    <div class="link-list">
      
      <!-- ▼ 01: スライド -->
      <a href="report-2026-01.pdf" target="_blank" class="pixel-item">
        <div class="pixel-badge type-slide">
          <div class="badge-main">SLIDE 01</div>
          <div class="badge-tab"></div>
        </div>
        <span class="item-label">スライド 01</span>
      </a>

      <!-- ▼ 02: スライド -->
      <a href="report-2026-02.pdf" target="_blank" class="pixel-item">
        <div class="pixel-badge type-slide">
          <div class="badge-main">SLIDE 02</div>
          <div class="badge-tab"></div>
        </div>
        <span class="item-label">スライド 02</span>
      </a>

      <!-- ▼ 03: スライド -->
      <a href="report-2026-03.pdf" target="_blank" class="pixel-item">
        <div class="pixel-badge type-slide">
          <div class="badge-main">SLIDE 03</div>
          <div class="badge-tab"></div>
        </div>
        <span class="item-label">スライド 03</span>
      </a>

      <!-- ▼ 04: レポート -->
      <a href="report-2026-04.pdf" target="_blank" class="pixel-item">
        <div class="pixel-badge type-report">
          <div class="badge-main">REPORT</div>
          <div class="badge-tab"></div>
        </div>
        <span class="item-label">レポート 04</span>
      </a>

    </div>

    <!-- ▼ 一番下のドット絵エリア（左にドラゴン、右に男の子、下に地面） -->
    <div class="stage-area">
      <div class="characters">
        <!-- 左：ドラゴンの画像 -->
        <img src="dragon.png" alt="Dragon" onerror="this.style.display='none';">
        <!-- 右：男の子の画像 -->
        <img src="boy.png" alt="Boy" onerror="this.style.display='none';">
      </div>
      <!-- 足元の地面 -->
      <div class="pixel-ground"></div>
    </div>
  </main>

</div>
</body>
</html>
