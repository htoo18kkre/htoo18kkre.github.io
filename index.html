<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-sky: #c1f0f7;       /* 最初の綺麗な水色 */
    --card-bg: #ffffff;      
    --border-main: #3d5a80;  /* 綺麗な青みの枠線 */
    --accent-pink: #ff8fab;  /* 差し色のピンク */
    --text-main: #2b3a4a;    
  }

  body {
    background-color: var(--bg-sky);
    color: var(--text-main);
    font-family: 'DotGothic16', monospace;
    line-height: 1.8;
    margin: 0;
    padding: 0;
  }

  .wrap {
    max-width: 540px;
    margin: 0 auto;
    padding: 40px 16px 60px;
  }

  /* シンプルなタイトル */
  header {
    text-align: center;
    margin-bottom: 28px;
    background: #ffffff;
    border: 4px solid var(--border-main);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 5px 0px var(--border-main);
  }

  h1 {
    font-size: 1.5rem;
    letter-spacing: 0.1em;
    margin: 0;
    color: var(--accent-pink);
    text-shadow: 2px 2px 0px var(--border-main);
  }

  /* レポートリスト（コンパクトでスマートなボタン） */
  .grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
  }

  .card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    border: 3px solid var(--border-main);
    border-radius: 10px;
    padding: 12px 18px;
    text-decoration: none;
    color: var(--text-main);
    font-size: 1rem;
    font-weight: bold;
    box-shadow: 0 4px 0px var(--border-main);
    transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s;
  }

  .card:hover {
    transform: translateY(2px);
    box-shadow: 0 2px 0px var(--border-main);
    background: #fff5f8;
    color: var(--accent-pink);
  }

  .card-arrow {
    font-size: 0.85rem;
    color: var(--accent-pink);
  }

  /* ▼ 後で自分で描いた絵を挿入するためのエリア（一番下） */
  .pixel-art-container {
    background: #ffffff;
    border: 4px solid var(--border-main);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 5px 0px var(--border-main);
  }

  /* 自分で描いた画像をアップロードしたあと、ここのimgタグに反映されます */
  .pixel-art-container img {
    max-width: 100%;
    height: auto;
    image-rendering: pixelated; /* ドット絵をくっきり綺麗に見せる設定 */
    display: block;
    margin: 0 auto;
  }

  /* 画像がまだ無いとき用のプレースホルダー */
  .art-placeholder {
    padding: 20px;
    color: #8c7b9c;
    font-size: 0.85rem;
    border: 2px dashed #b0c4de;
    border-radius: 8px;
    background: #f7fcfe;
  }

  footer {
    margin-top: 28px;
    text-align: center;
    font-size: 0.75rem;
    color: #5a6b7c;
  }
</style>
</head>
<body>
<div class="wrap">
  
  <header>
    <h1>★ MY ARCHIVE ★</h1>
  </header>

  <main>
    <div class="grid">
      <a href="report-2026-01.pdf" target="_blank" class="card">
        <span>レポート 01</span>
        <span class="card-arrow">▶</span>
      </a>
      <a href="report-2026-02.pdf" target="_blank" class="card">
        <span>レポート 02</span>
        <span class="card-arrow">▶</span>
      </a>
      <a href="report-2026-03.pdf" target="_blank" class="card">
        <span>レポート 03</span>
        <span class="card-arrow">▶</span>
      </a>
      <a href="report-2026-04.pdf" target="_blank" class="card">
        <span>レポート 04</span>
        <span class="card-arrow">▶</span>
      </a>
    </div>

    <!-- ▼ 後で自分で描いたドット絵を載せる場所 -->
    <div class="pixel-art-container">
      <!-- 
        【使い方】
        あとで自分で描いたドット絵の画像（例: boy.png）をGitHubにアップロードしたら、
        下の「src="my-pixel-art.png"」の部分をご自身の画像の名前に書き換えてください。
      -->
      <img src="my-pixel-art.png" alt="My Pixel Art" onerror="this.style.display='none'; document.getElementById('no-art').style.display='block';">
      
      <div id="no-art" class="art-placeholder" style="display:none;">
        ここに自分で描いたドット絵が表示されます<br>（画像をアップロードしてファイル名を合わせてね）
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 YOUR NAME
  </footer>

</div>
</body>
</html>
