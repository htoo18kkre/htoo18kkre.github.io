<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #263e73;
    color: #ffffff;
    font-family: 'DotGothic16', monospace;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    -webkit-font-smoothing: none;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 56px 32px 64px;
    box-sizing: border-box;
  }

  /* タイトル */
  header {
    margin-bottom: 48px;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.08em;
    margin: 0;
    font-weight: normal;
    text-shadow: 0 4px 0 #142242;
  }

  /* ボタンのリスト */
  .link-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 56px;
  }

  .pixel-item {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: #ffffff;
    cursor: pointer;
    user-select: none;
  }

  /* クリック感を出す立体影ラッパー */
  .badge-shadow {
    display: inline-flex;
    filter: drop-shadow(0px 5px 0px #142242);
    transition: transform 0.08s steps(2, start), filter 0.08s steps(2, start);
  }

  /* ドット絵ボタン形状 */
  .pixel-badge {
    display: inline-flex;
    align-items: stretch;
    height: 46px;
    position: relative;
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.3);
    clip-path: polygon(
      0 6px, 3px 6px, 3px 3px, 6px 3px, 6px 0,
      calc(100% - 6px) 0, calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px,
      100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%,
      6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0 calc(100% - 6px)
    );
  }

  .badge-main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    font-size: 1.3rem;
    letter-spacing: 0.06em;
    color: #ffffff;
    line-height: 1;
  }

  .badge-tab {
    width: 18px;
    position: relative;
  }

  .badge-tab::before,
  .badge-tab::after {
    content: "";
    position: absolute;
    right: 5px;
    width: 4px;
    height: 4px;
    background-color: #ffffff;
  }
  .badge-tab::before { top: 7px; }
  .badge-tab::after { bottom: 7px; }

  /* スライド用ボタンの色 */
  .type-slide .badge-main { background-color: #f24b59; }
  .type-slide .badge-tab { background-color: #ff8e80; }

  /* レポート用ボタンの色 */
  .type-report .badge-main { background-color: #38b814; }
  .type-report .badge-tab { background-color: #72e647; }

  /* ボタン右横のタイトル文字 */
  .item-label {
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    white-space: nowrap;
    text-shadow: 0 3px 0 #142242;
    transition: transform 0.08s steps(2, start), color 0.08s;
  }

  /* ホバー＆タップ時の押し込みアクション */
  .pixel-item:hover .badge-shadow,
  .pixel-item:active .badge-shadow {
    transform: translateY(4px);
    filter: drop-shadow(0px 1px 0px #142242);
  }

  .pixel-item:hover .item-label,
  .pixel-item:active .item-label {
    transform: translateY(2px);
    color: #ffe680;
  }

  /* キャラクター並び（地面なし・枠なし） */
  .characters {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 16px;
    width: 100%;
    margin-top: 24px;
  }

  .characters img {
    width: 135px;
    max-width: 45%;
    height: auto;
    display: block;
    image-rendering: pixelated;
  }
</style>
</head>
<body ontouchstart="">

  <div class="wrap">
    <header>
      <h1>ARCHIVE</h1>
    </header>

    <main>
      <div class="link-list">
        
        <!-- ▼ 01: スライド -->
        <a href="report-2026-01.pdf" target="_blank" class="pixel-item">
          <div class="badge-shadow">
            <div class="pixel-badge type-slide">
              <div class="badge-main">SLIDE 01</div>
              <div class="badge-tab"></div>
            </div>
          </div>
          <span class="item-label">企業研究</span>
        </a>

        <!-- ▼ 02: スライド -->
        <a href="report-2026-02.pdf" target="_blank" class="pixel-item">
          <div class="badge-shadow">
            <div class="pixel-badge type-slide">
              <div class="badge-main">SLIDE 02</div>
              <div class="badge-tab"></div>
            </div>
          </div>
          <span class="item-label">企業研究</span>
        </a>

        <!-- ▼ 03: スライド -->
        <a href="report-2026-03.pdf" target="_blank" class="pixel-item">
          <div class="badge-shadow">
            <div class="pixel-badge type-slide">
              <div class="badge-main">SLIDE 03</div>
              <div class="badge-tab"></div>
            </div>
          </div>
          <span class="item-label">経営分析</span>
        </a>

        <!-- ▼ 04: レポート -->
        <a href="report-2026-04.pdf" target="_blank" class="pixel-item">
          <div class="badge-shadow">
            <div class="pixel-badge type-report">
              <div class="badge-main">REPORT 01</div>
              <div class="badge-tab"></div>
            </div>
          </div>
          <span class="item-label">経営分析</span>
        </a>

      </div>

      <!-- ▼ ドット絵エリア（左に星座、右に月、地面なし） -->
      <div class="characters">
        <!-- 左：星座の画像 -->
        <img src="seiza.PNG" alt="Seiza" onerror="this.style.display='none';">
        <!-- 右：月の画像 -->
        <img src="moon.PNG" alt="Moon" onerror="this.style.display='none';">
      </div>
    </main>
  </div>

</body>
</html>
