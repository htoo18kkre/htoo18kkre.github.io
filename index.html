<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DREAM ARCHIVE</title>
<!-- レトロで可愛いドット風フォント -->
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-sky: #c1f0f7;       /* 優しい水色（背景） */
    --card-bg: #ffffff;      /* カードの中身は白 */
    --border-main: #4a3b5c;  /* ドット絵風の濃い紫色のアウトライン */
    --accent-pink: #ff8fab;  /* カービィ風のポップなピンク */
    --accent-blue: #70d6ff;  /* 綺麗な水色のアクセント */
    --text-main: #3a2e47;    /* 読みやすい濃いパープルグレー */
  }

  body {
    background-color: var(--bg-sky);
    /* カービィの背景にあるようなドットのパターンをうっすら表現 */
    background-image: radial-gradient(#a2e4f0 15%, transparent 16%), radial-gradient(#a2e4f0 15%, transparent 16%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    color: var(--text-main);
    font-family: 'DotGothic16', monospace;
    line-height: 1.8;
    margin: 0;
    padding: 0;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 16px 80px;
  }

  /* ヘルパー（タイトル部分） */
  header {
    text-align: center;
    margin-bottom: 36px;
    background: #ffffff;
    border: 4px solid var(--border-main);
    border-radius: 16px;
    padding: 24px 16px;
    box-shadow: 0 6px 0px var(--border-main);
  }

  h1 {
    font-size: 1.7rem;
    letter-spacing: 0.1em;
    margin: 0 0 6px;
    color: var(--accent-pink);
    text-shadow: 2px 2px 0px var(--border-main);
  }

  .sub {
    font-size: 0.88rem;
    color: #6c5b7b;
    margin: 0;
  }

  /* セクション見出し */
  h2 {
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    text-align: center;
    color: #ffffff;
    background: var(--accent-blue);
    border: 3px solid var(--border-main);
    border-radius: 12px;
    padding: 8px;
    margin: 32px 0 20px;
    box-shadow: 0 4px 0px var(--border-main);
    text-shadow: 1px 1px 0px var(--border-main);
  }

  /* カード（資料一覧） */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .card {
    display: block;
    background: var(--card-bg);
    border: 4px solid var(--border-main);
    border-radius: 14px;
    padding: 18px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 6px 0px var(--border-main);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  /* 押したときにポコっと沈む可愛いアクション */
  .card:hover {
    transform: translateY(2px);
    box-shadow: 0 4px 0px var(--border-main);
    background: #fff9fb;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .tag {
    font-size: 0.72rem;
    background: var(--accent-pink);
    color: #ffffff;
    padding: 2px 10px;
    font-weight: bold;
    border: 2px solid var(--border-main);
    border-radius: 8px;
  }

  .date {
    font-size: 0.78rem;
    color: #8c7b9c;
  }

  .card h3 {
    font-size: 1.05rem;
    margin: 4px 0 6px;
    color: var(--text-main);
  }

  .card p {
    font-size: 0.85rem;
    color: #6c5b7b;
    margin: 0 0 14px;
  }

  /* ポップな「よむ！」ボタン */
  .pixel-btn {
    display: inline-block;
    background: var(--accent-blue);
    color: var(--border-main);
    font-size: 0.82rem;
    font-weight: bold;
    padding: 5px 14px;
    border: 3px solid var(--border-main);
    border-radius: 10px;
    box-shadow: 0 3px 0px var(--border-main);
    float: right;
  }

  .card:hover .pixel-btn {
    background: var(--accent-pink);
    color: #ffffff;
  }

  /* フッター */
  footer {
    margin-top: 50px;
    text-align: center;
    font-size: 0.75rem;
    color: #6c5b7b;
    background: rgba(255,255,255,0.6);
    border: 2px solid var(--border-main);
    border-radius: 10px;
    padding: 10px;
  }
</style>
</head>
<body>
<div class="wrap">

  </main>

  <footer>

</div>
</body>
</html>
