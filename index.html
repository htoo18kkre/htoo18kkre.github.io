<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY ARCHIVE | 個人サイト・資料置き場</title>
  <style>
    :root {
      --bg-color: #fafafa;
      --card-bg: #ffffff;
      --text-main: #222222;
      --text-sub: #666666;
      --border-color: #e6e6e6;
      --accent-color: #111111;
      --hover-bg: #f2f2f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      line-height: 1.7;
      letter-spacing: 0.03em;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    .site-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .site-subtitle {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 36px;
    }

    .social-links a {
      display: inline-block;
      padding: 6px 16px;
      font-size: 0.82rem;
      color: var(--text-main);
      text-decoration: none;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--card-bg);
      transition: all 0.2s ease;
    }

    .social-links a:hover {
      background: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .main-visual {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background-color: #efefef;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    .main-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .materials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .material-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .material-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      border-color: #bbbbbb;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--hover-bg);
      color: var(--text-main);
      letter-spacing: 0.04em;
    }

    .date {
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .card-title {
      font-size: 1.02rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 16px;
    }
