<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #263e73;
    color: #ffffff;
    font-family: 'DotGothic16', monospace;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* 地面を常に画面の一番下に配置 */
    -webkit-font-smoothing: none;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 56px 32px 20px;
    box-sizing: border-box;
  }

  /* タイトル */
  header {
    margin-bottom: 48px;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.08em;
    margin: 0;
    font-weight: normal;
    text-shadow: 0 4px 0 #142242;
  }

  /* ボタンのリスト */
  .link-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 40px;
  }

  .pixel-item {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: #ffffff;
    cursor: pointer;
    user-select: none;
  }

  /* ✦ クリック感を出すための立体影ラッパー */
  .badge-shadow {
    display: inline-flex;
    /* ドットの角に沿った立体的な下影 */
    filter: drop-shadow(0px 5px 0px #142242);
    transition: transform 0.08s steps(2, start), filter 0.08s steps(2, start);
  }

  /* ドット絵ボタン形状 */
  .pixel-badge {
    display: inline-flex;
    align-items: stretch;
    height: 46px;
    position: relative;
    /* 上端にうっすらハイライトを入れて立体感をアップ */
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.3);
    clip-path: polygon(
      0 6px, 3px 6px, 3px 3px, 6px 3px, 6px 0,
      calc(100% - 6px) 0, calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px,
      100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%,
      6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0 calc(100% - 6px)
    );
  }

  .badge-main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    font-size: 1.3rem;
    letter-spacing: 0.06em;
    color: #ffffff;
    line-height: 1;
  }

  .badge-tab {
    width: 18px;
    position: relative;
  }

  .badge-tab::before,
  .badge-tab::after {
    content: "";
    position: absolute;
    right: 5px;
    width: 4px;
    height: 4px;
    background-color: #ffffff;
  }
  .badge-tab::before { top: 7px; }
  .badge-tab::after { bottom: 7px; }

  /* ✦ スライド用ボタンの色 */
  .type-slide .badge-main { background-color: #f24b59; }
  .type-slide .badge-tab { background-color: #ff8e80; }

  /* ✦ レポート用ボタンの色 */
  .type-report .badge-main { background-color: #38b814; }
  .type-report .badge-tab { background-color: #72e647; }

  /* ボタン右横のタイトル文字 */
  .item-label {
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    white-space: nowrap;
    text-shadow: 0 3px 0 #142242;
    transition: transform 0.08s steps(2, start), color 0.08s;
  }

  /* ▼ ホバー＆タップ時：カチッと下に沈み込むアクション */
  .pixel-item:hover .badge-shadow,
  .pixel-item:active .badge-shadow {
    transform: translateY(4px);
    filter: drop-shadow(0px 1px 0px #142242);
  }

  .pixel-item:hover .item-label,
  .pixel-item:active .item-label {
    transform: translateY(2px);
    color: #ffe680;
  }

  /* ▼ 画面の一番下に固定されるステージ＆地面エリア */
  .stage-footer {
    width: 100%;
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* キャラクター並び（左：ドラゴン、右：男の子） */
  .characters {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 16px;
    width: 100%;
    max-width: 420px;
    padding: 0 20px;
    box-sizing: border-box;
    position: relative;
    z-index: 2;
  }

  .characters img {
    width: 135px;
    max-width: 45%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    /* ※ドラゴンの絵の下に透明な余白があって浮いて見える場合は、この「-6px」を「-15px」や「-20px」に変えると地面にピタッと着地します */
    margin-bottom: -6px;
  }

  /* 画面の端から端・一番底まで続くドット絵の地面 */
  .pixel-ground {
    width: 100%;
    height: 44px;
    background-color: #5c3a21; /* 土のベース色 */
    /* ドット絵の芝生と土の模様 */
    background-image: 
      linear-gradient(90deg, #48a842 50%, #3b8c36 50%),
      linear-gradient(90deg, #5c3a21 50%, #4d301b 50%);
    background-size: 16px 10px, 32px 34px;
    background-position: 0 0, 0 10px;
    background-repeat: repeat-x, repeat;
    border-top: 4px solid #72d65c; /* 芝生の上の明るいドットライン */
    box-sizing: border-box;
  }
</style>
</head>
<body ontouchstart="">

  <div class="wrap">
    <header>
      <h1>ARCHIVE</h1>
    </header>

    <main>
      <div class="link-list">
        
        <!-- ▼ 01: スライド -->
        <a href="report-2026-01.pdf" target="_blank" class="pixel-item">
          <div class="badge-shadow">
            <div class="pixel-badge type-slide">
              <div class="badge-main">SLIDE 01</div>
              <div class="badge-tab"></div>
            </div>
          </div>
          <span class="item-label">スライド 01</span>
        </a>

        <!-- ▼ 02: スライド -->
        <a href="report-2026-02.pdf" target="_blank" class="pixel-item">
          <div class="badge-shadow">
            <div class="pixel-badge type-slide">
              <div class="badge-main">SLIDE 02</div>
              <div class="badge-tab"></div>
            </div>
          </div>
          <span class="item-label">スライド 02</span>
        </a>

        <!-- ▼ 03: スライド -->
        <a href="report-2026-03.pdf" target="_blank" class="pixel-item">
          <div class="badge-shadow">
            <div class="pixel-badge type-slide">
              <div class="badge-main">SLIDE 03</div>
              <div class="badge-tab"></div>
            </div>
          </div>
          <span class="item-label">スライド 03</span>
        </a>

        <!-- ▼ 04: レポート -->
        <a href="report-2026-04.pdf" target="_blank" class="pixel-item">
          <div class="badge-shadow">
            <div class="pixel-badge type-report">
              <div class="badge-main">REPORT</div>
              <div class="badge-tab"></div>
            </div>
          </div>
          <span class="item-label">レポート 04</span>
        </a>

      </div>
    </main>
  </div>

  <!-- ▼ 画面の一番下に広がるドット絵ステージ（左にドラゴン、右に男の子、下に地面） -->
  <div class="stage-footer">
    <div class="characters">
      <!-- 左：ドラゴンの画像 -->
      <img src="dragon.png" alt="Dragon" onerror="this.style.display='none';">
      <!-- 右：男の子の画像 -->
      <img src="boy.png" alt="Boy" onerror="this.style.display='none';">
    </div>
    <div class="pixel-ground"></div>
  </div>

</body>
</html>
