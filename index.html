<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL ARCHIVE</title>
<!-- 昔のゲーム風のドットフォントを読み込み -->
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* サイト全体をドットフォント＆レトロな雰囲気にする */
  body {
    background-color: #1a1a24; /* レトロゲームの夜空や背景をイメージした濃い色 */
    color: #e0e0e0;
    font-family: 'DotGothic16', monospace;
    line-height: 1.8;
    margin: 0;
    padding: 0;
    image-rendering: pixelated;
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 16px 80px;
  }

  /* ヘルパー・タイトル周り */
  header {
    text-align: center;
    margin-bottom: 40px;
    border: 4px solid #ffffff;
    padding: 24px 16px;
    background: #0f0f14;
    box-shadow: 6px 6px 0px #000000;
  }

  h1 {
    font-size: 1.8rem;
    letter-spacing: 0.1em;
    margin: 0 0 8px;
    color: #50fa7b; /* ゲームのセーブ画面のようなグリーンやアクセント */
    text-shadow: 3px 3px 0px #ff79c6;
  }

  .sub {
    font-size: 0.9rem;
    color: #8be9fd;
    margin: 0;
  }

  /* セクション見出し */
  h2 {
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    text-align: center;
    color: #ffb86c;
    margin: 36px 0 20px;
    text-shadow: 2px 2px 0px #000000;
  }

  /* カード（資料一覧）をドット風の枠にする */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .card {
    display: block;
    background: #21212b;
    border: 4px solid #ffffff;
    border-radius: 0; /* カクカクしたドット感を出すために直角に */
    padding: 20px;
    text-decoration: none;
    color: inherit;
    box-shadow: 4px 4px 0px #000000;
    transition: transform 0.1s steps(2, start), background 0.1s;
  }

  /* スマホやPCで押したときにカクッと動くレトロ風のホバー */
  .card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0px #ff79c6;
    background: #282836;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .tag {
    font-size: 0.75rem;
    background: #ff79c6;
    color: #1a1a24;
    padding: 2px 8px;
    font-weight: bold;
    border: 2px solid #ffffff;
  }

  .date {
    font-size: 0.8rem;
    color: #6272a4;
  }

  .card h3 {
    font-size: 1.1rem;
    margin: 0 0 8px;
    color: #f8f8f2;
  }

  .card p {
    font-size: 0.88rem;
    color: #bd93f9;
    margin: 0 0 16px;
  }

  /* 可愛いピクセルアート風のボタン（クリックしてPDFへ） */
  .pixel-btn {
    display: inline-block;
    background: #50fa7b;
    color: #1a1a24;
    font-size: 0.85rem;
    font-weight: bold;
    padding: 6px 14px;
    border: 3px solid #ffffff;
    box-shadow: 3px 3px 0px #000000;
    text-align: right;
    float: right;
  }

  .card:hover .pixel-btn {
    background: #ff79c6;
    color: #ffffff;
  }

  /* フッター */
  footer {
    margin-top: 60px;
    text-align: center;
    font-size: 0.75rem;
    color: #6272a4;
  }
</style>
</head>
<body>
<div class="wrap">
  
  <header>
    <h1>[ PIXEL ARCHIVE ]</h1>
    <p class="sub">- ドットの世界と資料の置き場 -</p>
  </header>

  <main>
    <h2>SELECT MATERIAL</h2>
    <div class="grid">
      
      <!-- ▼ 資料 01 -->
      <a href="report-2026-01.pdf" target="_blank" class="card">
        <div class="card-top">
          <span class="tag">PDF</span>
          <span class="date">2026.10</span>
        </div>
        <h3>▶ レポート 01</h3>
        <p>ここに資料の説明を書きます。クリックするとPDFが開きます。</p>
        <div style="overflow:hidden;"><span class="pixel-btn">[ 📖 よむ ]</span></div>
      </a>

      <!-- ▼ 資料 02 -->
      <a href="report-2026-02.pdf" target="_blank" class="card">
        <div class="card-top">
          <span class="tag">PDF</span>
          <span class="date">2026.10</span>
        </div>
        <h3>▶ レポート 02</h3>
        <p>ここに資料の説明を書きます。クリックするとPDFが開きます。</p>
        <div style="overflow:hidden;"><span class="pixel-btn">[ 📖 よむ ]</span></div>
      </a>

      <!-- ▼ 資料 03 -->
      <a href="report-2026-03.pdf" target="_blank" class="card">
        <div class="card-top">
          <span class="tag">PDF</span>
          <span class="date">2026.10</span>
        </div>
        <h3>▶ レポート 03</h3>
        <p>ここに資料の説明を書きます。クリックするとPDFが開きます。</p>
        <div style="overflow:hidden;"><span class="pixel-btn">[ 📖 よむ ]</span></div>
      </a>

    </div>
  </main>

  <footer>
    &copy; 2026 YOUR NAME // PIXEL WORLD
  </footer>

</div>
</body>
</html>
