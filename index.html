<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDY ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-sky: #bfe9f7;       /* 基本の綺麗な水色 */
    --card-bg: #ffffff;      
    --border-main: #3d5a80;  /* 落ち着いた青みの枠線 */
    --accent-pink: #ff8fab;  /* 桜や差し色のピンク */
    --text-main: #2b3a4a;    
  }

  body {
    background-color: var(--bg-sky);
    /* ドット調のうっすらした背景パターン */
    background-image: radial-gradient(#a2e0f5 15%, transparent 16%), radial-gradient(#a2e0f5 15%, transparent 16%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    color: var(--text-main);
    font-family: 'DotGothic16', monospace;
    line-height: 1.8;
    margin: 0;
    padding: 0;
  }

  .wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 16px 60px;
  }

  /* ヘッダー（タイトルのみでシンプルに） */
  header {
    text-align: center;
    margin-bottom: 32px;
    background: #ffffff;
    border: 4px solid var(--border-main);
    border-radius: 16px;
    padding: 20px 16px;
    box-shadow: 0 6px 0px var(--border-main);
  }

  h1 {
    font-size: 1.6rem;
    letter-spacing: 0.1em;
    margin: 0;
    color: var(--accent-pink);
    text-shadow: 2px 2px 0px var(--border-main);
  }

  /* レポートリスト（タイトル一発タップ用） */
  .grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 40px;
  }

  /* レポートカード自体がリンクになっており、タップで一発でPDFが開く */
  .card {
    display: block;
    background: var(--card-bg);
    border: 4px solid var(--border-main);
    border-radius: 14px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--text-main);
    font-size: 1.05rem;
    font-weight: bold;
    box-shadow: 0 5px 0px var(--border-main);
    transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s;
  }

  .card:hover {
    transform: translateY(2px);
    box-shadow: 0 3px 0px var(--border-main);
    background: #fff5f8; /* ホバー時にうっすらピンクに */
    color: var(--accent-pink);
  }

  /* 下部のピクセルアート・演出エリア */
  .art-section {
    background: #ffffff;
    border: 4px solid var(--border-main);
    border-radius: 16px;
    padding: 24px 16px;
    text-align: center;
    box-shadow: 0 6px 0px var(--border-main);
    position: relative;
    overflow: hidden;
  }

  .art-title {
    font-size: 0.85rem;
    color: var(--accent-pink);
    margin-bottom: 12px;
    letter-spacing: 0.05em;
  }

  /* ドット絵風の男の子と勉強机のCSSアート表現 */
  .pixel-boy-stage {
    width: 140px;
    height: 100px;
    margin: 0 auto;
    background: #e8f4f8;
    border: 3px solid var(--border-main);
    border-radius: 8px;
    position: relative;
    image-rendering: pixelated;
  }

  /* 机 */
  .desk {
    position: absolute;
    bottom: 25px;
    left: 30px;
    width: 80px;
    height: 12px;
    background: #8b5a2b;
    border: 2px solid var(--border-main);
  }
  /* 本 */
  .book {
    position: absolute;
    bottom: 37px;
    left: 55px;
    width: 24px;
    height: 8px;
    background: var(--accent-pink);
    border: 2px solid var(--border-main);
  }
  /* 男の子の頭（パーカー等のイメージでピンクの差し色） */
  .boy-head {
    position: absolute;
    bottom: 43px;
    left: 58px;
    width: 18px;
    height: 18px;
    background: #ffb7b2;
    border: 2px solid var(--border-main);
    border-radius: 50%;
  }
  /* 男の子の服（水色のパーカー） */
  .boy-body {
    position: absolute;
    bottom: 25px;
    left: 53px;
    width: 28px;
    height: 18px;
    background: #70d6ff;
    border: 2px solid var(--border-main);
    border-radius: 6px 6px 0 0;
  }

  /* 桜の花びらが舞うアニメーション */
  .sakura {
    position: absolute;
    background: var(--accent-pink);
    border: 1px solid var(--border-main);
    border-radius: 50% 0 50% 0;
    opacity: 0.8;
    animation: fall 4s linear infinite;
  }
  .s1 { width: 8px; height: 8px; top: -10px; left: 20%; animation-delay: 0s; }
  .s2 { width: 6px; height: 6px; top: -10px; left: 60%; animation-delay: 1.5s; }
  .s3 { width: 7px; height: 7px; top: -10px; left: 80%; animation-delay: 3s; }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(120px) rotate(360deg); opacity: 0; }
  }

  /* フッター */
  footer {
    margin-top: 36px;
    text-align: center;
    font-size: 0.75rem;
    color: #6c5b7b;
  }
</style>
</head>
<body>
<div class="wrap">
  
  <header>
    <h1>★ MY ARCHIVE ★</h1>
  </header>

  <main>
    <div class="grid">
      <!-- ▼ レポート 01（タップで一発オープン） -->
      <a href="report-2026-01.pdf" target="_blank" class="card">
        レポート 01
      </a>

      <!-- ▼ レポート 02 -->
      <a href="report-2026-02.pdf" target="_blank" class="card">
        レポート 02
      </a>

      <!-- ▼ レポート 03 -->
      <a href="report-2026-03.pdf" target="_blank" class="card">
        レポート 03
      </a>

      <!-- ▼ レポート 04 -->
      <a href="report-2026-04.pdf" target="_blank" class="card">
        レポート 04
      </a>
    </div>

    <!-- ▼ 一番下のピクセルアートエリア（勉強する男の子 ＆ 舞う桜） -->
    <div class="art-section">
      <!-- 桜の舞い落ちる演出 -->
      <div class="sakura s1"></div>
      <div class="sakura s2"></div>
      <div class="sakura s3"></div>

      <div class="art-title">~ STUDY TIME ~</div>
      <div class="pixel-boy-stage">
        <div class="desk"></div>
        <div class="book"></div>
        <div class="boy-body"></div>
        <div class="boy-head"></div>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 YOUR NAME
  </footer>

</div>
</body>
</html>
